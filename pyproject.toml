[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidds-gen"
version = "0.1.0"
description = "Do deep sequence models detect held-out attack scenarios in LID-DS-2021, or memorise seen ones?"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
analysis = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
